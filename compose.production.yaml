services:
 caddy:
  image: caddy:2.8-alpine
  ports: ["80:80","443:443"]
  volumes: ["./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"]
  depends_on: [api]
 api:
  build: .
  command: uvicorn lead_engine.api:app --host 0.0.0.0 --port 8000
  environment: [APP_ENV=production, DATABASE_URL=postgresql+psycopg://leadpro:$${POSTGRES_PASSWORD}@postgres:5432/leadpro, REDIS_URL=redis://redis:6379/0, CAMOFOX_URL=http://camofox:9374]
  depends_on: [postgres,redis,camofox]
 worker:
  build: .
  command: python -m lead_engine.worker
  environment: [APP_ENV=production, DATABASE_URL=postgresql+psycopg://leadpro:$${POSTGRES_PASSWORD}@postgres:5432/leadpro, REDIS_URL=redis://redis:6379/0, CAMOFOX_URL=http://camofox:9374]
  depends_on: [postgres,redis,camofox]
 postgres:
  image: postgres:16-alpine
  environment: [POSTGRES_DB=leadpro,POSTGRES_USER=leadpro,POSTGRES_PASSWORD=$${POSTGRES_PASSWORD}]
  volumes: [pgdata:/var/lib/postgresql/data]
 redis:
  image: redis:7-alpine
  command: redis-server --appendonly no
 camofox:
  image: ghcr.io/jo-inc/camofox-browser:1.14.0
  environment: [CAMOFOX_HEADLESS=true,CAMOFOX_TELEMETRY=false,CAMOFOX_PERSISTENCE=false]
  expose: ["9374"]
volumes: {pgdata: {}}
